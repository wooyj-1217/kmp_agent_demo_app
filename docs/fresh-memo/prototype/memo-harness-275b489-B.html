<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여백 · 디자인 시안</title><link rel="stylesheet" href="tokens.css"><style>
/* Requirements FRESH-MEMO P1; harness 275b489fda59d4904031ae8fb445f845485603c6; proposal B r1; new design without prior product reference. */
.app{display:grid;grid-template-columns:204px minmax(360px,1fr) minmax(340px,420px);min-height:100vh}.rail{padding:36px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}.brand{font-size:30px;font-weight:750;letter-spacing:-2px}.brand small{display:block;font-size:10px;letter-spacing:3px;font-weight:500;margin-top:0}.rail nav{display:grid;gap:6px}.rail nav button{text-align:left}.rail nav button[aria-pressed=true]{background:#E4E9DE;font-weight:700}.rail footer{margin-top:auto;font-size:12px}.library{padding:38px 32px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0 24px}h1{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:0}h2{font-size:19px;line-height:1.4;margin:0 0 12px}.sub{font-size:13px;margin:8px 0 0}.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:48px}.listmeta{display:flex;justify-content:space-between;align-items:center;margin:24px 0 16px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;text-align:left;padding:22px;min-height:228px;border-radius:var(--radius);background:var(--sage);border:2px solid transparent;width:100%;overflow:hidden}.card.selected{border-color:var(--forest)}.card.indigo{background:var(--indigo)}.card.apricot{background:var(--apricot)}.card p{font-size:14px;white-space:pre-line;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.card .meta{font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:22px}.editor{background:var(--surface);padding:28px 28px 24px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}.toolbar button{padding:8px 10px}.back{display:none}.paper{flex:1;display:flex;flex-direction:column;margin-top:48px;min-height:0}.date{font-size:11px;letter-spacing:1px}.title{width:100%;border:0;background:transparent;font-size:28px;line-height:1.4;font-weight:700;letter-spacing:-1px;margin-top:20px;resize:none;min-height:85px}.body{width:100%;flex:1;border:0;background:transparent;resize:none;font-size:16px;line-height:1.9;margin-top:16px;min-height:180px}.editorfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;font-size:11px}.state{grid-column:1/-1;padding:48px 24px;text-align:center;background:var(--surface);border-radius:20px}.state h2{margin-bottom:8px}.state button{margin-top:16px}.demo{position:fixed;bottom:12px;left:12px;z-index:5;background:white;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;box-shadow:0 4px 16px #243e3612}.demo select{font-size:11px;border:0;background:white;min-height:32px}.toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);background:var(--forest);color:white;border-radius:12px;padding:12px 20px;z-index:10}.mobile-nav{display:none}.emptyeditor{margin:auto;text-align:center}.hidden{display:none!important}
@media(min-width:1440px){.library{padding:40px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1099px){.app{grid-template-columns:168px minmax(0,1fr)}.rail{padding:28px 16px}.editor{display:none;position:fixed;inset:0 0 0 168px;z-index:3}.app.editing .editor{display:flex}.back{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:699px){.app{display:block}.rail{display:none}.library{padding:28px 20px 100px}.heading{margin-top:14px}h1{font-size:28px}.eyebrow{letter-spacing:3px}.grid{gap:12px}.card{padding:16px;min-height:220px;border-radius:16px}h2{font-size:17px}.card p{font-size:13px}.editor{inset:0;padding:16px 20px max(20px,env(safe-area-inset-bottom));min-height:100dvh;height:100dvh}.paper{margin-top:28px}.title{font-size:28px}.mobile-nav{display:flex;gap:8px;margin-top:20px;overflow:auto}.mobile-nav button{white-space:nowrap;font-size:13px}.mobile-nav button[aria-pressed=true]{background:var(--forest);color:white}.listmeta{margin-top:20px}.demo{bottom:8px;font-size:10px;max-width:calc(100vw - 24px)}.app.editing .library{display:none}}
@media(max-width:359px){.grid{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* B: focused journal — compact vertical index and a broad writing surface. */
@media(min-width:1100px){.app{grid-template-columns:184px 360px minmax(480px,1fr)}.library{padding:36px 24px}.grid{grid-template-columns:1fr;gap:0}.card,.card.indigo,.card.apricot{min-height:132px;border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:20px 12px}.card.selected{background:var(--sage);border-left:3px solid var(--forest)}.card h2{font-size:17px;margin-bottom:5px}.card p{-webkit-line-clamp:2;font-size:13px}.card .meta{padding-top:9px}.editor{padding:28px 56px}.paper{max-width:680px;width:100%;margin-left:auto;margin-right:auto}.title{font-size:36px}.body{font-size:18px;line-height:2}.eyebrow{font-size:10px;letter-spacing:1px}.heading{display:block}.heading>.primary{margin-top:16px}.sub{font-size:12px}h1{font-size:26px}}
@media(max-width:699px){.grid{grid-template-columns:1fr;gap:0}.card,.card.indigo,.card.apricot{min-height:140px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 8px}.card.selected{background:var(--sage)}.card p{-webkit-line-clamp:2}.card .meta{padding-top:12px}}
</style></head><body><div class="app" id="app"><aside class="rail"><div class="brand">여백<small>YEOBACK</small></div><button class="primary" data-action-id="ACT-001" onclick="createNote()">＋ 새 메모</button><nav aria-label="메모 탐색"><button aria-pressed="true" onclick="setFilter('all',this)">모든 메모</button><button aria-pressed="false" onclick="setFilter('pin',this)">고정한 메모</button><button aria-pressed="false" onclick="setFilter('trash',this)">휴지통</button></nav><footer class="muted">생각이 머무는 자리.<br>오직 이 기기에 보관됩니다.</footer></aside><main class="library" data-screen-id="SCREEN-001"><div class="eyebrow">YEOBACK / YOUR QUIET SPACE</div><header class="heading"><div><h1 id="listtitle">모든 메모</h1><p class="sub muted">떠오른 생각을, 가볍게 남겨요.</p></div><button class="primary" onclick="createNote()" aria-label="새 메모 만들기">＋ 메모</button></header><label class="sr-only" for="search">메모 검색</label><input id="search" class="search" type="search" placeholder="제목이나 내용으로 검색" data-action-id="ACT-003" oninput="render()"><nav class="mobile-nav" aria-label="메모 탐색"><button aria-pressed="true" onclick="setFilter('all',this)">모든 메모</button><button aria-pressed="false" onclick="setFilter('pin',this)">고정</button><button aria-pressed="false" onclick="setFilter('trash',this)">휴지통</button></nav><div class="listmeta muted"><span id="count">메모 4개</span><span>최근 수정순</span></div><section id="grid" class="grid" aria-label="메모 목록" data-state-id="STATE-001"></section></main><section class="editor" data-screen-id="SCREEN-002" aria-label="메모 편집"><div class="toolbar"><div><button class="back quiet" onclick="closeEditor()" aria-label="메모 목록으로 돌아가기">← 목록</button><span id="save" aria-live="polite">저장됨</span> <button class="primary" onclick="saveNote()" data-action-id="ACT-007">저장</button></div><div><button id="pin" onclick="togglePin()" data-action-id="ACT-004" aria-label="메모 고정" aria-pressed="false">고정</button><button onclick="deleteNote()" data-action-id="ACT-005" aria-label="휴지통으로 이동">삭제</button></div></div><div class="paper" id="paper"><span class="date muted">나만의 작은 기록</span><label class="sr-only" for="title">메모 제목</label><textarea id="title" class="title" placeholder="제목 없음" rows="2" oninput="edit()" data-action-id="ACT-002"></textarea><label class="sr-only" for="body">메모 내용</label><textarea id="body" class="body" placeholder="어떤 생각이 떠올랐나요?" oninput="edit()"></textarea></div><div class="editorfoot muted"><span id="length">0자</span><span>여백 / YEOBACK</span></div></section></div><div class="demo"><label for="demo">디자인 검토 전용 · 샘플 데이터</label> <select id="demo" onchange="changeState(this.value)"><option value="normal">정상</option><option value="empty">첫 사용</option><option value="loading">불러오는 중</option><option value="error">저장 실패</option></select></div><div id="toast" class="toast hidden" role="status"></div><script>
// Fixture data is exclusive to this prototype. Never seed product storage with it.
let notes=[{id:1,title:'천천히 시작하는 아침',body:'창문을 열고 바람을 들인다.\n커피가 내려지는 동안 오늘의 마음을 잠깐 살펴보기.\n\n조금 느려도 괜찮은 하루.',color:'sage',pin:true},{id:2,title:'언젠가의 작은 서점',body:'햇빛이 오래 머무는 창가.\n책과 커피, 그리고 편하게 앉을 수 있는 의자 두 개.\n\n좋아하는 것들을 모아두는 공간.',color:'indigo',pin:false},{id:3,title:'주말에 하고 싶은 것',body:'토요일 아침 동네 산책\n읽다 만 책 마저 읽기\n제철 과일 사러 가기',color:'apricot',pin:false},{id:4,title:'잊고 싶지 않은 문장',body:'“기록은 오늘의 나를 미래의 나에게 건네는 일.”\n\n오늘 마음에 남은 것들을 적어둔다.',color:'sage',pin:false}];let selected=1,filter='all',state='normal';let timer;
const el=id=>document.getElementById(id);function escapeText(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){let q=el('search').value.trim().toLowerCase();let list=notes.filter(n=>(filter==='trash'?n.deleted:!n.deleted)&&(filter!=='pin'||n.pin)&&(!q||(n.title+' '+n.body).toLowerCase().includes(q)));el('count').textContent='메모 '+list.length+'개';el('grid').dataset.stateId=state==='empty'?'STATE-002':state==='loading'?'STATE-003':'STATE-001';if(state==='loading'){el('grid').innerHTML='<div class="state" role="status"><h2>메모를 불러오고 있어요</h2><p class="muted">잠시만 기다려 주세요.</p></div>';return}if(state==='empty'||!list.length){el('grid').innerHTML='<div class="state"><h2>'+ (q?'검색 결과가 없어요':filter==='trash'?'휴지통이 비어 있어요':'첫 생각을 남겨볼까요?')+'</h2><p class="muted">'+(q?'다른 단어로 다시 찾아보세요.':'짧은 한 줄로 시작해도 좋아요.')+'</p>'+(!q&&filter!=='trash'?'<button class="primary" onclick="createNote()">새 메모 만들기</button>':'')+'</div>';return}el('grid').innerHTML=list.map(n=>'<button class="card '+n.color+(selected===n.id?' selected':'')+'" data-action-id="ACT-006" onclick="openNote('+n.id+')"><h2>'+escapeText(n.title||'제목 없는 메모')+'</h2><p>'+escapeText(n.body||'내용 없음')+'</p><span class="meta"><span>오늘</span><span>'+(n.pin?'고정됨':'메모')+'</span></span></button>').join('');}
function openNote(id){if(typeof dirty!=='undefined'&&dirty&&!confirm('변경 내용을 버릴까요? 취소하면 계속 편집합니다.'))return;dirty=false;selected=id;let n=notes.find(n=>n.id===id);el('title').value=n.title;el('body').value=n.body;el('pin').setAttribute('aria-pressed',n.pin);el('pin').textContent=n.deleted?'복원':n.pin?'고정 해제':'고정';el('app').classList.add('editing');el('length').textContent=(n.title.length+n.body.length)+'자';render();}
function closeEditor(){if(dirty&&!confirm('변경 내용을 버릴까요? 취소하면 계속 편집합니다.'))return;dirty=false;el('app').classList.remove('editing');if(notes.find(n=>n.id===selected))openValues();}function openValues(){let n=notes.find(n=>n.id===selected);el('title').value=n.title;el('body').value=n.body;}function createNote(){state='normal';filter='all';let n={id:Date.now(),title:'',body:'',color:'sage',pin:false};notes.unshift(n);openNote(n.id);el('title').focus();}
let dirty=false;function edit(){dirty=true;el('save').textContent='저장 전';el('length').textContent=(el('title').value.length+el('body').value.length)+'자';}
function saveNote(){if(!el('title').value.trim()&&!el('body').value.trim()){el('save').textContent='제목이나 내용을 입력해 주세요';return}if(state==='error'){el('save').textContent='저장하지 못했어요. 입력은 유지됩니다.';return}let n=notes.find(n=>n.id===selected);n.title=el('title').value;n.body=el('body').value;dirty=false;el('save').textContent='저장됨';closeEditor();render();}
function togglePin(){let n=notes.find(n=>n.id===selected);if(!n)return;if(n.deleted){n.deleted=false;filter='all';}else n.pin=!n.pin;openNote(n.id);}
function deleteNote(){let n=notes.find(n=>n.id===selected);if(!n)return;n.deleted=true;closeEditor();render();el('toast').innerHTML='휴지통으로 이동했어요 <button style="color:white;text-decoration:underline" onclick="undo('+n.id+')">실행 취소</button>';el('toast').classList.remove('hidden');}
function undo(id){notes.find(n=>n.id===id).deleted=false;el('toast').classList.add('hidden');render();}
function setFilter(v,b){filter=v;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',false));b.setAttribute('aria-pressed',true);el('listtitle').textContent=v==='pin'?'고정한 메모':v==='trash'?'휴지통':'모든 메모';render();}
function changeState(v){state=v;el('save').textContent=v==='error'?'저장하지 못했어요 · 다시 시도':'저장됨';if(v==='error'){el('toast').textContent='저장하지 못했어요. 입력을 유지한 채 저장 버튼으로 다시 시도하세요.';el('toast').classList.remove('hidden')}else el('toast').classList.add('hidden');render();}
openNote(1);el('app').classList.remove('editing');
</script></body></html>
