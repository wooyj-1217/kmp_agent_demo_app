plugins { id 'com.android.application' }

android {
    namespace 'app.teum.memo'
    compileSdk 35
    defaultConfig { applicationId 'app.teum.memo'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    sourceSets { main { assets.srcDirs = ['../web'] } }
    buildTypes { debug { applicationIdSuffix '.debug' }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
